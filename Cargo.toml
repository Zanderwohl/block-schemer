[workspace]
resolver = "3"
members = ["crates/block-parse", "crates/block-parse-gui", "crates/block-schemer"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.1"
edition = "2024"

[workspace.dependencies]
block-parse = { path = "crates/block-parse" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
egui = "0.36"
eframe = "0.36"
clap = { version = "4", features = ["derive"] }
rfd = "0.17"
# Only for its offscreen wgpu renderer.
egui_kittest = { version = "0.36", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
winit = "0.30"
muda = { version = "0.21", default-features = false }
palette = { version = "0.7", default-features = false, features = ["std"] }

# Steel 0.8.3 plus `SteelVal::new_dyn_reader_port`, which Block Schemer's
# console input needs; drop once upstream has one (vendor/steel-core/PATCH.md).
[patch.crates-io]
steel-core = { path = "vendor/steel-core" }
