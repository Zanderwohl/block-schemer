[package]
name = "block-schemer"
description = "Block Schemer: Scheme from blocks"
version.workspace = true
edition.workspace = true

[features]
# `block-schemer --snapshot <program.scmb> <out.png>`, which renders offscreen.
snapshot = ["block-parse-gui/snapshot"]

[dependencies]
block-parse.workspace = true
block-parse-gui = { path = "../block-parse-gui", features = ["app"] }
steel-core = { version = "0.8" }

# Building on Windows for Windows embeds the icon in the executable.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# For `cargo bundle`, which makes the macOS .app that shows the iconset.
[package.metadata.bundle]
name = "Block Schemer"
identifier = "io.github.zanderwohl.block-schemer"
icon = ["crates/block-schemer/assets/icons/block-schemer.iconset/*.png"]
version = "0.1.1"
copyright = "© 2026 Alexander Lowry"
category = "public.app-category.developer-tools"
short_description = "Scheme editor with visual blocks"
# resources = ["assets/Credits.rtf"]
