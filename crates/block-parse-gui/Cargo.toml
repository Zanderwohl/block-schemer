[package]
name = "block-parse-gui"
description = "An egui block editor for block-parse languages"
version.workspace = true
edition.workspace = true

[features]
default = []
# The standalone editor window. Off by default so embedding the component never
# pulls in a windowing backend.
app = ["dep:eframe", "dep:clap", "dep:rfd", "dep:winit"]
# Offscreen images of programs, and the editor's `--command snapshot`.
snapshot = ["dep:egui_kittest", "dep:image"]

[dependencies]
block-parse.workspace = true
egui.workspace = true
palette.workspace = true
eframe = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
egui_kittest = { workspace = true, optional = true }
image = { workspace = true, optional = true }

# Only to turn off winit's default macOS menu, whose Quit bypasses the save prompt.
[target.'cfg(target_os = "macos")'.dependencies]
winit = { workspace = true, optional = true }

[[bin]]
name = "block-parse-editor"
path = "src/bin/editor.rs"
required-features = ["app"]
